name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install Dox
        run: haxelib install dox

      - name: Build Aedifex runner
        run: haxe run.hxml

      - name: Register local Aedifex checkout
        run: haxelib dev aedifex .

      - name: Build docs artifact
        run: haxelib run aedifex task docs .

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: aedifex-docs
          path: dist/docs

  core-targets:
    name: ${{ matrix.os }} - ${{ matrix.target }}${{ matrix.qualifierLabel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS on an Intel image: macos-13 was retired, and its jobs sat
        # queued with no runner to take them. Intel keeps them as they were --
        # HashLink's JIT is x86-64 only -- where Apple silicon would change
        # what is tested rather than repair it.
        include:
          - os: windows-latest
            target: cpp
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsMsvc: true
          - os: windows-latest
            target: neko
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsNeko: true
          - os: windows-latest
            target: jvm
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsJava: true
          - os: windows-latest
            target: php
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsPhp: true
          - os: windows-latest
            target: js
            qualifier: "-node"
            qualifierLabel: " - node"
            runTarget: true
            needsNode: true
          - os: windows-latest
            target: js
            qualifier: "-html5"
            qualifierLabel: " - html5"
            runTarget: false
          - os: ubuntu-latest
            target: cpp
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
          - os: ubuntu-latest
            target: hl
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsHashLink: true
          - os: ubuntu-latest
            target: neko
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsNeko: true
          - os: ubuntu-latest
            target: jvm
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsJava: true
          - os: ubuntu-latest
            target: php
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsPhp: true
          - os: ubuntu-latest
            target: js
            qualifier: "-node"
            qualifierLabel: " - node"
            runTarget: true
            needsNode: true
          - os: ubuntu-latest
            target: js
            qualifier: "-html5"
            qualifierLabel: " - html5"
            runTarget: false
          - os: macos-15-intel
            target: cpp
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
          - os: macos-15-intel
            target: hl
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsHashLink: true
          - os: macos-15-intel
            target: neko
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsNeko: true
          - os: macos-15-intel
            target: jvm
            qualifier: ""
            qualifierLabel: ""
            runTarget: true
            needsJava: true
          # No PHP on macOS. setup-php installs it through Homebrew, which
          # calls this Intel image a Tier 3 configuration; it spent 27
          # minutes there and then reported "Could not setup PHP 8.3". The
          # PHP target is the same generated PHP everywhere, and runs on
          # Ubuntu and Windows.
          - os: macos-15-intel
            target: js
            qualifier: "-node"
            qualifierLabel: " - node"
            runTarget: true
            needsNode: true
          - os: macos-15-intel
            target: js
            qualifier: "-html5"
            qualifierLabel: " - html5"
            runTarget: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Haxe
        if: runner.os != 'macOS'
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      # v2 on macOS, and only there. v1 puts Neko where the macOS haxelib
      # binary cannot find it, so every job on the Intel image stopped at
      # "dyld: Library not loaded: @rpath/libneko.2.dylib" before building
      # anything; setup-haxe fixed that in v2.0.0 (#47). CrossByte's macOS
      # job hit the same and made the same change. The other runners pass
      # on v1 and are left alone.
      - name: Set up Haxe (macOS)
        if: runner.os == 'macOS'
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Set up MSVC
        if: matrix.needsMsvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Java
        if: matrix.needsJava
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        if: matrix.needsNode
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up PHP
        if: matrix.needsPhp
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install Neko on Ubuntu
        if: runner.os == 'Linux' && matrix.needsNeko
        run: |
          sudo apt-get update
          sudo apt-get install -y neko

      - name: Install HashLink on Ubuntu
        if: runner.os == 'Linux' && matrix.needsHashLink
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libturbojpeg-dev libvorbis-dev libopenal-dev libsdl2-dev libglu1-mesa-dev libmbedtls-dev libuv1-dev libsqlite3-dev
          # A release, not master: master moved to SDL3 with 1.16 and the build
          # stopped at SDL3/SDL.h. 1.15 is the last release on SDL2, which the
          # line above installs.
          git clone --depth 1 --branch 1.15 https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink
          make -C /tmp/hashlink
          sudo make -C /tmp/hashlink install
          sudo ldconfig

      # No Neko from Homebrew on macOS: setup-haxe v2 installs one, which is
      # on the PATH first. Installing Homebrew's as well put a second
      # libneko where the loader looks first, and haxelib -- built against
      # setup-haxe's -- loaded that one and crashed with a segfault.

      - name: Install HashLink on macOS
        if: runner.os == 'macOS' && matrix.needsHashLink
        run: |
          brew update
          brew install hashlink

      - name: Install HashLink and Neko on Windows
        if: runner.os == 'Windows' && (matrix.needsHashLink || matrix.needsNeko)
        shell: pwsh
        run: |
          if ("${{ matrix.needsHashLink }}" -eq "true") {
            choco install hashlink -y
          }
          if ("${{ matrix.needsNeko }}" -eq "true") {
            choco install neko -y
          }

      - name: Build Aedifex runner
        run: haxe run.hxml

      - name: Register local Aedifex checkout
        run: haxelib dev aedifex .

      - name: Setup target
        shell: pwsh
        run: |
          $args = @('run', 'aedifex', 'setup', '${{ matrix.target }}')
          if ('${{ matrix.qualifier }}' -ne '') { $args += '${{ matrix.qualifier }}' }
          & haxelib @args

      - name: Verify setup contract
        shell: pwsh
        run: |
          $args = @('run', 'aedifex', 'setup', '${{ matrix.target }}', '-check', '-json')
          if ('${{ matrix.qualifier }}' -ne '') { $args += '${{ matrix.qualifier }}' }
          & haxelib @args

      - name: Build example
        shell: pwsh
        run: |
          $args = @('run', 'aedifex', 'build', '${{ matrix.target }}', 'examples/hello-world', '-release', '-ignore')
          if ('${{ matrix.qualifier }}' -ne '') { $args += '${{ matrix.qualifier }}' }
          & haxelib @args

      - name: Run example
        if: matrix.runTarget
        shell: pwsh
        run: |
          $args = @('run', 'aedifex', 'run', '${{ matrix.target }}', 'examples/hello-world', '-release', '-ignore')
          if ('${{ matrix.qualifier }}' -ne '') { $args += '${{ matrix.qualifier }}' }
          & haxelib @args

